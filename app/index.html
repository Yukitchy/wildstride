<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wildstride — Setouchi → Shikoku Traverse</title>
<meta name="description" content="マルチデイ自転車ツアーの軌跡・標高・写真と動画を、1枚の地図で見返す。尾道→しまなみ海道→四国カルスト→高知、7日間490kmの記録。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0F1A1D">
<meta property="og:type" content="website">
<meta property="og:title" content="Wildstride — 自転車ツアーの記録アプリ">
<meta property="og:description" content="マルチデイ自転車ツアーの軌跡・標高・写真と動画を、1枚の地図で見返す。尾道→しまなみ海道→四国カルスト→高知、7日間490kmの記録。">
</head>
<body>
<style>
:root{
  --bg:#EAEEEA; --surface:#FFFFFF; --surface2:#F4F7F3; --sunk:#E4EAE4;
  --ink:#0F1A1D; --ink2:#495B5F; --ink3:#7D8F91; --line:#D2DBD6;
  --sea:#CFE1E7; --sea2:#BED6DE; --land:#E8EEE1; --contour:rgba(72,102,80,.30);
  --route:#1E86C4; --route-soft:rgba(30,134,196,.20);
  --accent:#D9640F; --accent-ink:#FFFFFF;
  --danger:#C8402F; --water:#0E8F94; --photo:#A87A08; --food:#7A5AA8; --rest:#3E6E57;
  --shadow:0 1px 2px rgba(16,30,34,.10),0 8px 24px rgba(16,30,34,.08);
  --f-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-num:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#080E11; --surface:#111B1F; --surface2:#162226; --sunk:#0C1417;
    --ink:#E7EFEE; --ink2:#9CB0B2; --ink3:#697D80; --line:#22343A;
    --sea:#0A1D25; --sea2:#0D2831; --land:#132019; --contour:rgba(122,178,142,.24);
    --route:#43B6EF; --route-soft:rgba(67,182,239,.18);
    --accent:#FF9040; --accent-ink:#16120C;
    --danger:#F0625C; --water:#3ECBCF; --photo:#DCAE2E; --food:#B49BE8; --rest:#5FB88C;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.42);
  }
}
:root[data-theme="light"]{
  --bg:#EAEEEA; --surface:#FFFFFF; --surface2:#F4F7F3; --sunk:#E4EAE4;
  --ink:#0F1A1D; --ink2:#495B5F; --ink3:#7D8F91; --line:#D2DBD6;
  --sea:#CFE1E7; --sea2:#BED6DE; --land:#E8EEE1; --contour:rgba(72,102,80,.30);
  --route:#1E86C4; --route-soft:rgba(30,134,196,.20);
  --accent:#D9640F; --accent-ink:#FFFFFF;
  --danger:#C8402F; --water:#0E8F94; --photo:#A87A08; --food:#7A5AA8; --rest:#3E6E57;
  --shadow:0 1px 2px rgba(16,30,34,.10),0 8px 24px rgba(16,30,34,.08);
}
:root[data-theme="dark"]{
  --bg:#080E11; --surface:#111B1F; --surface2:#162226; --sunk:#0C1417;
  --ink:#E7EFEE; --ink2:#9CB0B2; --ink3:#697D80; --line:#22343A;
  --sea:#0A1D25; --sea2:#0D2831; --land:#132019; --contour:rgba(122,178,142,.24);
  --route:#43B6EF; --route-soft:rgba(67,182,239,.18);
  --accent:#FF9040; --accent-ink:#16120C;
  --danger:#F0625C; --water:#3ECBCF; --photo:#DCAE2E; --food:#B49BE8; --rest:#5FB88C;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{
  font-family:var(--f-ui); color:var(--ink); background:var(--bg);
  height:100vh; height:100dvh; max-width:440px; margin:0 auto;
  display:flex; flex-direction:column; overflow:hidden; position:relative;
  border-left:1px solid var(--line); border-right:1px solid var(--line);
  -webkit-font-smoothing:antialiased;
}
@media (min-width:441px){ #app{box-shadow:0 0 80px rgba(0,0,0,.18)} }
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:0 0 auto;z-index:20}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mark{width:26px;height:26px;flex:0 0 auto}
.t1{font-size:12.5px;font-weight:750;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:10.5px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbtns{display:flex;gap:6px;flex:0 0 auto}
.chip{height:28px;padding:0 10px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);
  font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink2);display:flex;align-items:center;gap:5px}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ---- panels ---- */
main{flex:1 1 auto;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.panel.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;flex:1;padding:14px 14px 24px}

/* ---- map ---- */
.mapwrap{position:relative;flex:1 1 auto;min-height:180px;background:var(--sea);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;pointer-events:none}
.hudcell{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:9px;padding:5px 8px 6px;flex:1;min-width:0}
.hudcell .v{font-size:17px;font-weight:700;line-height:1.05;white-space:nowrap}
.hudcell .v small{font-size:9.5px;font-weight:600;color:var(--ink3);margin-left:2px}
.hudcell .lab{margin-bottom:2px}
.callout{position:absolute;left:8px;right:8px;bottom:8px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:9px;padding:7px 10px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:5}
.callout.show{opacity:1;transform:none}
.callout .cn{font-size:12.5px;font-weight:700}
.callout .cd{font-size:10.5px;color:var(--ink2);margin-top:1px;line-height:1.4}
.mapbadge{position:absolute;right:8px;bottom:8px;background:color-mix(in srgb,var(--surface) 84%,transparent);
  backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:9px;
  letter-spacing:.08em;color:var(--ink3);font-weight:600;pointer-events:none}

/* ---- controls ---- */
.ctrl{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--surface);
  border-top:1px solid var(--line)}
.play{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.play:active{transform:scale(.93)}
.play svg{width:17px;height:17px;fill:currentColor}
.ctrlmeta{flex:1;min-width:0}
.ctrlmeta .d1{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrlmeta .d2{font-size:10px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- profile ---- */
.profwrap{flex:0 0 auto;background:var(--surface);padding:0 0 4px;position:relative}
#prof{display:block;width:100%;height:96px;touch-action:none;cursor:ew-resize}
.profax{position:absolute;left:10px;right:10px;bottom:2px;display:flex;justify-content:space-between;
  font-size:8.5px;color:var(--ink3);pointer-events:none;font-family:var(--f-num)}

/* ---- day strip ---- */
.daystrip{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:9px 12px 11px;
  background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface2);border-radius:10px;
  padding:6px 9px;text-align:left;min-width:76px}
.dchip .dn{font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--ink3)}
.dchip .dk{font-size:13px;font-weight:700;margin-top:1px;font-family:var(--f-num)}
.dchip .dk small{font-size:9px;color:var(--ink3);font-weight:600}
.dchip.on{background:var(--ink);border-color:var(--ink)}
.dchip.on .dn{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.dchip.on .dk{color:var(--bg)}
.dchip.on .dk small{color:color-mix(in srgb,var(--bg) 60%,transparent)}

/* ---- generic cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 2px 9px}
.sechead:first-child{margin-top:2px}
.sechead h2{font-size:13px;font-weight:750;letter-spacing:.01em;margin:0}
.sechead .sh{font-size:10px;color:var(--ink3)}

/* summary */
.hero{padding:16px 15px 15px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .ht{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.hero .hn{font-size:23px;font-weight:800;letter-spacing:-.01em;margin-top:5px;line-height:1.15}
.hero .hd{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.5}
.bigrow{display:flex;gap:12px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.big{flex:1}
.big .bv{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em}
.big .bv small{font-size:11px;font-weight:600;color:var(--ink3);margin-left:2px;letter-spacing:0}
.big .lab{margin-top:5px}
.minirow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.mini{background:var(--surface2);border-radius:10px;padding:8px 6px;text-align:center}
.mini .mv{font-size:15px;font-weight:750;line-height:1}
.mini .ml{font-size:8.5px;color:var(--ink3);margin-top:4px;font-weight:600;letter-spacing:.04em}

/* day card */
.daycard{width:100%;text-align:left;padding:12px 13px;display:block;margin-bottom:9px}
.daycard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.dh{display:flex;align-items:center;gap:8px}
.dbadge{width:30px;height:30px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;
  font-size:11px;font-weight:800;flex:0 0 auto;font-family:var(--f-num)}
.daycard.on .dbadge{background:var(--accent);color:var(--accent-ink)}
.dtitle{flex:1;min-width:0}
.dtitle .a{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtitle .b{font-size:10px;color:var(--ink3);margin-top:1px}
.dstats{display:flex;gap:12px;margin-top:9px}
.dstat .sv{font-size:14px;font-weight:750;font-family:var(--f-num);letter-spacing:-.02em}
.dstat .sv small{font-size:9px;color:var(--ink3);font-weight:600}
.dstat .sl{font-size:8.5px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-top:2px}
.spark{width:100%;height:34px;display:block;margin-top:8px}
.dhl{font-size:10.5px;color:var(--ink2);margin-top:8px;line-height:1.45;display:flex;gap:6px;align-items:flex-start}
.dhl .q{color:var(--accent);font-weight:800;flex:0 0 auto}
.pinrow{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.pinchip{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;color:var(--ink2);
  background:var(--surface2);border-radius:6px;padding:3px 6px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

/* briefing */
.segbar{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.segbar button{flex:1;font-size:11px;font-weight:700;padding:7px 4px;border-radius:8px;color:var(--ink3)}
.segbar button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.brief{padding:15px 15px 14px;margin-top:11px}
.briefhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.briefhead .bt{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.briefhead .bs{font-size:10.5px;color:var(--ink3);margin-top:3px}
.wx{text-align:right;flex:0 0 auto}
.wx .wt{font-size:17px;font-weight:750;font-family:var(--f-num)}
.wx .ws{font-size:9.5px;color:var(--ink3);margin-top:1px}
.tl{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
.tlrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tlrow:last-child{border-bottom:none}
.tltime{font-family:var(--f-num);font-size:11.5px;font-weight:700;width:42px;flex:0 0 auto;padding-top:1px}
.tlbar{width:2px;background:var(--line);flex:0 0 auto;border-radius:1px;position:relative}
.tlbar::before{content:"";position:absolute;left:-3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.tlrow[data-k="danger"] .tlbar::before{background:var(--danger)}
.tlrow[data-k="water"] .tlbar::before{background:var(--water)}
.tlrow[data-k="photo"] .tlbar::before{background:var(--photo)}
.tlrow[data-k="food"] .tlbar::before{background:var(--food)}
.tlrow[data-k="rest"] .tlbar::before{background:var(--rest)}
.tlbody{flex:1;min-width:0}
.tlbody .n{font-size:12px;font-weight:700}
.tlbody .d{font-size:10.5px;color:var(--ink2);margin-top:2px;line-height:1.45}
.tlbody .km{font-size:9.5px;color:var(--ink3);font-family:var(--f-num);margin-top:3px}
.guestrow{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.guestrow:last-child{border-bottom:none}
.av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;color:var(--accent-ink);background:var(--accent)}
.gname{font-size:11.5px;font-weight:700}
.gmeta{font-size:9.5px;color:var(--ink3);margin-top:1px}
.gnote{font-size:10.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
.flagpill{font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--ink3);border:1px solid var(--line);
  border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:1px}
.alert{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 32%,var(--line));
  border-radius:10px;padding:9px 11px;margin-top:12px}
.alert .at{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--danger)}
.alert .ad{font-size:11px;color:var(--ink2);margin-top:4px;line-height:1.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:12px;font-size:11px}
.kv dt{color:var(--ink3);font-weight:600;white-space:nowrap}
.kv dd{margin:0;color:var(--ink2)}

/* certificate */
.cert{margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow);position:relative}
.certtop{padding:16px 16px 12px;background:linear-gradient(160deg,var(--sunk),var(--surface));
  border-bottom:1px dashed var(--line);position:relative}
.certlab{font-size:8.5px;letter-spacing:.28em;color:var(--accent);font-weight:800}
.certname{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:7px;line-height:1.15}
.certsub{font-size:10.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.certmap{display:block;width:100%;height:150px;background:var(--sea)}
.certstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.certstat{padding:11px 8px;text-align:center;border-right:1px solid var(--line)}
.certstat:last-child{border-right:none}
.certstat .cv{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1}
.certstat .cv small{font-size:9px;color:var(--ink3);font-weight:600}
.certstat .cl{font-size:8px;color:var(--ink3);letter-spacing:.1em;margin-top:4px;font-weight:700}
.stamps{display:flex;gap:5px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.stamp{flex:1;min-width:38px;border:1px solid var(--line);border-radius:7px;padding:5px 2px;text-align:center;background:var(--surface2)}
.stamp .sd{font-size:8px;color:var(--ink3);font-weight:700;letter-spacing:.06em}
.stamp .sk{font-size:10px;font-weight:750;font-family:var(--f-num);margin-top:2px}
.certfoot{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 15px 15px;border-top:1px solid var(--line)}
.sig{font-size:10px;color:var(--ink3)}
.sig b{display:block;font-size:13px;color:var(--ink);margin-top:3px;letter-spacing:.02em}
.seal{width:56px;height:56px;flex:0 0 auto}
.gpick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.gpick::-webkit-scrollbar{display:none}
.gbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:20px;padding:4px 11px 4px 4px;font-size:11px;font-weight:650}
.gbtn .av{width:24px;height:24px;font-size:9px;background:var(--sunk);color:var(--ink2)}
.gbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gbtn.on .av{background:var(--accent);color:var(--accent-ink)}
.note{font-size:10px;color:var(--ink3);line-height:1.55;margin-top:11px;padding:0 2px}

/* tabs */
.tabs{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;color:var(--ink3)}
.tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9px;font-weight:700;letter-spacing:.03em}
.tab.on{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="none" stroke="var(--line)" stroke-width="1.4"/>
        <path d="M3 21 Q9 12 14 17 T22 9 T29 15" fill="none" stroke="var(--route)" stroke-width="2.1" stroke-linecap="round"/>
        <circle cx="22" cy="9" r="3.1" fill="var(--accent)"/>
      </svg>
      <div style="min-width:0">
        <div class="t1">SETOUCHI &rarr; SHIKOKU TRAVERSE</div>
        <div class="t2" id="tourSub"></div>
      </div>
    </div>
    <div class="topbtns">
      <button class="chip" id="langBtn" aria-label="Language">EN</button>
      <button class="chip" id="themeBtn" aria-label="Theme">
        <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.4a6.6 6.6 0 100 13.2z" fill="currentColor"/><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="panel on" id="p-map">
      <div class="mapwrap">
        <svg id="map" viewBox="0 0 1000 1470" preserveAspectRatio="xMidYMid slice" aria-label="Route map"></svg>
        <div class="hud">
          <div class="hudcell"><div class="lab" data-i18n="hDist">DIST</div><div class="v num" id="hDist">0.0<small>km</small></div></div>
          <div class="hudcell"><div class="lab" data-i18n="hEle">ELEV</div><div class="v num" id="hEle">0<small>m</small></div></div>
          <div class="hudcell"><div class="lab" data-i18n="hGrad">GRADE</div><div class="v num" id="hGrad">0.0<small>%</small></div></div>

<script>

var RAD = Math.PI/180;
var W = {lat0:34.56, lat1:32.86, lng0:132.33, lng1:133.72, k:Math.cos(33.7*RAD)};
var SCALE = 1000/((W.lng1-W.lng0)*W.k);

function px(lng){ return (lng-W.lng0)*W.k*SCALE; }

function P(p){ return [px(p[1]), py(p[0])]; }

function hav(a,b){
  var dLat=(b[0]-a[0])*RAD, dLng=(b[1]-a[1])*RAD;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 6371*2*Math.asin(Math.min(1,Math.sqrt(s)));

/* ---- terrain: sum of gaussians at real summit positions ---- */
var PEAKS=[
  [33.768,133.115,1982,.085],[33.790,133.200,1760,.070],[33.850,133.420,1620,.085],
  [33.700,132.900,1180,.062],[33.920,132.855, 900,.048],[34.020,133.120, 520,.052],
  [33.550,132.950,1360,.058],[33.460,132.930,1320,.046],[33.445,132.980,1300,.040],
  [33.550,133.100,1420,.062],[33.420,133.100,1250,.055],[33.650,133.450,1380,.075],
  [33.300,132.750,1180,.070],[33.350,133.050, 980,.058],[33.450,133.300, 720,.052],
  [33.150,132.900, 620,.060],[33.050,132.800, 700,.055],[32.980,132.660, 980,.050],
  [33.230,133.200, 560,.048],[33.100,133.150, 480,.045],[33.600,132.700, 620,.048],
  [33.520,132.760, 640,.038],[33.350,132.480, 700,.045],[33.750,132.760, 480,.040],
  [33.900,133.250, 900,.055],[33.250,132.620, 820,.050],[34.310,133.180, 300,.020],
  [34.255,133.005, 380,.022],[34.150,133.020, 300,.020],[34.380,133.200, 150,.016],
  [34.290,133.085, 250,.018],[34.210,133.060, 200,.015],[34.430,133.100, 190,.030]
];
/* river valleys: gaussians build ridges but never cut the gorges the road
   follows. Each entry pulls terrain toward a valley-floor height, so the
   Shimanto still descends from Kubokawa to the sea instead of flattening. */
var VALLEYS=[
  [33.208,133.100,190,.028],[33.198,133.030,120,.028],[33.182,132.975, 82,.028],
  [33.192,132.918, 62,.028],[33.210,132.862, 48,.030],[33.170,132.870, 42,.028],
  [33.120,132.880, 32,.028],[33.062,132.892, 22,.028],[33.000,132.920, 12,.030],
  [33.300,133.100,300,.028],[33.245,133.122,240,.026],[33.520,132.640, 62,.028],
  [33.506,132.556, 22,.028],[33.560,132.905,300,.024],
  /* coastal plains and port towns sit at sea level, not on the shoulder of a peak */
  [34.406,133.195, 14,.020],[34.065,132.998, 10,.022],[33.845,132.772, 26,.028],
  [33.935,132.770, 14,.020],[33.220,133.295, 10,.020],[33.390,133.280, 12,.022],
  [33.490,133.430, 18,.024],[33.545,133.528, 10,.034],[33.497,133.573,  6,.018],[33.567,133.544,  8,.026]];
function elevAt(lat,lng){
  var mx=0,sum=0;
  for(var i=0;i<PEAKS.length;i++){
    var p=PEAKS[i], dy=(lat-p[0]), dx=(lng-p[1])*W.k, s=p[3];
    var d2=(dx*dx+dy*dy)/(2*s*s);

    var v2=(vx*vx+vy*vy)/(2*vs*vs);

  }
  if(bw>0) e+=(bf-e)*Math.min(.88,bw);
  return Math.max(4,e);
}

/* ---- coastlines (hand-authored, smoothed) ---- */
function smooth(pts){
  var n=pts.length, d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(var i=0;i<n;i++){
    var p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    d+="C"+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+","+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+
       " "+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+","+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+
       " "+p2[0].toFixed(1)+","+p2[1].toFixed(1);
  }
  return d+"Z";
}
function ring(ll){ return smooth(ll.map(P)); }

  var pts=[], n=11, s=seed;

];

/* ---- marching squares contours ---- */
function contourPaths(levels){
  var la0=32.88, la1=34.50, lo0=132.36, lo1=133.68, nx=170, ny=190;
  var g=[], y,x;
  for(y=0;y<=ny;y++){ var row=[]; for(x=0;x<=nx;x++){
      row.push(elevAt(la1-(la1-la0)*y/ny, lo0+(lo1-lo0)*x/nx)); } g.push(row); }
  var gx=function(x){ return px(lo0+(lo1-lo0)*x/nx); };
  var gy=function(y){ return py(la1-(la1-la0)*y/ny); };
  var out=[];
  for(var L=0;L<levels.length;L++){
    var lv=levels[L], d="";
    for(y=0;y<ny;y++) for(x=0;x<nx;x++){
      var a=g[y][x], b=g[y][x+1], c=g[y+1][x+1], e=g[y+1][x];

      if(idx===0||idx===15) continue;
      var X0=gx(x),X1=gx(x+1),Y0=gy(y),Y1=gy(y+1);
      var T=function(){ return [X0+(X1-X0)*((lv-a)/(b-a)), Y0]; };
      var R=function(){ return [X1, Y0+(Y1-Y0)*((lv-b)/(c-b))]; };
      var B=function(){ return [X0+(X1-X0)*((lv-e)/(c-e)), Y1]; };
      var Lf=function(){ return [X0, Y0+(Y1-Y0)*((lv-a)/(e-a))]; };
      var seg=[];
      switch(idx){
        case 1: case 14: seg=[Lf(),B()]; break;
        case 2: case 13: seg=[B(),R()]; break;
        case 3: case 12: seg=[Lf(),R()]; break;
        case 4: case 11: seg=[T(),R()]; break;
        case 6: case 9:  seg=[T(),B()]; break;
        case 7: case 8:  seg=[Lf(),T()]; break;
        case 5: seg=[Lf(),T()]; d+="M"+B()[0].toFixed(1)+","+B()[1].toFixed(1)+"L"+R()[0].toFixed(1)+","+R()[1].toFixed(1); break;
        case 10: seg=[T(),R()]; d+="M"+Lf()[0].toFixed(1)+","+Lf()[1].toFixed(1)+"L"+B()[0].toFixed(1)+","+B()[1].toFixed(1); break;
      }
      if(seg.length) d+="M"+seg[0][0].toFixed(1)+","+seg[0][1].toFixed(1)+"L"+seg[1][0].toFixed(1)+","+seg[1][1].toFixed(1);
    }
    out.push({lv:lv,d:d});
  }
  return out;
}

/* ---- ride engine: distance, elevation, speed, time ---- */
function buildDay(d){
  var s=[], i, j;
  s.push({lat:d.pts[0][0],lng:d.pts[0][1]});
  for(i=1;i<d.pts.length;i++){
    var a=d.pts[i-1], b=d.pts[i], seg=hav(a,b), n=Math.max(1,Math.ceil(seg/0.2));
    for(j=1;j<=n;j++){
      var t=j/n;
      s.push({lat:a[0]+(b[0]-a[0])*t, lng:a[1]+(b[1]-a[1])*t});
    }
  }
  /* Roads meander and switchback; waypoint chords do not. Displace laterally,
     more in steep terrain, so drawn length and measured distance stay identical.
     d.amp is the per-day calibration against published route distances. */
  var N=s.length, amp=0.0030*(d.amp||1), ph=d.n*7.3, wig=[];
  for(i=0;i<N;i++){
    var taper=Math.sin(Math.PI*i/(N-1));
    var pa=s[Math.max(0,i-1)], pb=s[Math.min(N-1,i+1)];
    var dy=pb.lat-pa.lat, dx=(pb.lng-pa.lng)*W.k, ln=Math.sqrt(dx*dx+dy*dy)||1;
    var a2=amp*(0.55+Math.min(1.6,elevAt(s[i].lat,s[i].lng)/700))*taper;
    var o=Math.sin(i*1.15+ph)*a2+Math.sin(i*0.47+ph*2)*a2*0.9+Math.sin(i*2.3+ph*3)*a2*0.3;
    wig.push({lat:s[i].lat+(dx/ln)*o, lng:s[i].lng-(dy/ln)*o/W.k});
  }
  s=wig; s[0].d=0;
  for(i=1;i<s.length;i++) s[i].d=s[i-1].d+hav([s[i-1].lat,s[i-1].lng],[s[i].lat,s[i].lng]);
  for(i=0;i<s.length;i++) s[i].raw=Math.max(0,elevAt(s[i].lat,s[i].lng));
  var win=6;
  for(i=0;i<s.length;i++){
    var sum=0,c=0;
    for(j=Math.max(0,i-win);j<=Math.min(s.length-1,i+win);j++){ sum+=s[j].raw; c++; }
    s[i].e=sum/c;
  }
  var gain=0, mark=s[0].e, maxE=0;
  for(i=1;i<s.length;i++){
    if(s[i].e>maxE) maxE=s[i].e;
    if(s[i].e-mark>4){ gain+=s[i].e-mark; mark=s[i].e; }
    else if(s[i].e<mark) mark=s[i].e;
  }
  var t=0;
  s[0].t=0; s[0].v=0; s[0].g=0;
  for(i=1;i<s.length;i++){
    var dd=s[i].d-s[i-1].d, de=s[i].e-s[i-1].e;
    var gr=dd>0? de/(dd*1000):0;
    var v=25/(1+Math.max(0,gr)*26)+Math.max(0,-gr)*95;
    v=Math.max(6.5,Math.min(63,v));
    t+=dd/v;
    s[i].t=t; s[i].v=v; s[i].g=gr*100;
  }
  d.s=s; d.km=s[s.length-1].d; d.gain=gain; d.maxE=maxE; d.hours=t;
  d.poi.forEach(function(p){
    p.i=Math.min(s.length-1,Math.round(p.f*(s.length-1)));
    p.km=s[p.i].d;
    var stops=0;
    p.time=d.start+s[p.i].t+(p.k==="food"?0:0);
  });
  var stopMin=0;
  d.poi.forEach(function(p){ p.timeAdj=d.start+s[p.i].t+stopMin/60; stopMin+=(p.k==="food"?45:p.k==="photo"?9:p.k==="water"?12:6); });
  d.stopH=stopMin/60;
  return d;
}

function setVB(v){ map.setAttribute("viewBox",v.x.toFixed(1)+" "+v.y.toFixed(1)+" "+v.w.toFixed(1)+" "+v.h.toFixed(1)); }
function fitDay(d,pad){
  var xs=[],ys=[];
  d.pts.forEach(function(p){ var q=P(p); xs.push(q[0]); ys.push(q[1]); });
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  var w=x1-x0,h=y1-y0, m=Math.max(w,h)*(pad||0.18)+30;

  w=x1-x0; h=y1-y0;

  if(h/w<r) { var nh=w*r; y0-=(nh-h)/2; h=nh; } else { var nw=h/r; x0-=(nw-w)/2; w=nw; }

function flyTo(v,instant){

function camTick(dt){

  vb={x:vbFrom.x+(vbTarget.x-vbFrom.x)*e, y:vbFrom.y+(vbTarget.y-vbFrom.y)*e,
      w:vbFrom.w+(vbTarget.w-vbFrom.w)*e, h:vbFrom.h+(vbTarget.h-vbFrom.h)*e};

  var a=d.s[lo],b=d.s[hi],sp=b.d-a.d,t=sp>0?(km-a.d)/sp:0;

  document.getElementById("hTime").textContent=hhmm(d.start+p.t+stops/60);

    (lang==="ja"?"獲得 ":"Ascent ")+fmt(d.gain,0)+" m · "+hm(d.hours+d.stopH)+" · "+L(d.sub);
  var near=-1;
  d.poi.forEach(function(x,j){ if(S.km>=x.km-0.05 && S.km<x.km+0.9) near=j; });
  if(near>=0 && near!==S.lastPoi){ showCallout(d.poi[near]); S.lastPoi=near; }
  if(near<0 && S.km<0.05) S.lastPoi=-1;
  if(window.WSM) WSM.onProgress(d,S.km);
}
var coTimer=null;
function showCallout(p){
  var c=document.getElementById("callout");
  document.getElementById("coName").textContent=L({ja:p.ja,en:p.en});
  document.getElementById("coDesc").textContent=L({ja:p.dja,en:p.den});
  c.style.borderLeftColor=PINCOL[p.k];
  c.classList.add("show");
  clearTimeout(coTimer);
  coTimer=setTimeout(function(){ c.classList.remove("show"); },3600);
}
var last=0;
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  camTick(dt);
  if(S.playing){
    var d=day();
    S.km+=dt*(d.km/24)*S.speed;
    if(S.km>=d.km){
      S.km=d.km; update();
      if(S.tour && S.di<DAYS.length-1){ setTimeout(function(){ setDay(S.di+1); },900); }
      else { S.playing=false; setIcon(); }
    } else update();
  }
  requestAnimationFrame(loop);
}
function setIcon(){
  document.getElementById("playIcon").innerHTML=S.playing
    ? '<path d="M4 2.5h3.2v11H4zM8.8 2.5H12v11H8.8z"/>'
    : '<path d="M4 2.5v11l9-5.5z"/>';
}

/* ---- sparkline ---- */
function spark(d,w,h){
  var maxE=Math.max(320,d.maxE*1.1),p="",st=Math.max(1,Math.floor(d.s.length/70));
  for(var i=0;i<d.s.length;i+=st){
    p+=(i?"L":"M")+(d.s[i].d/d.km*w).toFixed(1)+","+(h-2-(d.s[i].e/maxE)*(h-6)).toFixed(1);
  }
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+p+'L'+w+','+h+'L0,'+h+'Z" fill="var(--route-soft)"/>'+
    '<path d="'+p+'" fill="none" stroke="var(--route)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
}

  var xs=[],ys=[];

    b.addEventListener("click",function(){ setDay(+b.getAttribute("data-d")); });

/* profile scrubbing */
(function(){
  var drag=false;
  function at(ev){
    var r=prof.getBoundingClientRect();
    var x=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width;
    setProgress(Math.max(0,Math.min(1,x))*day().km);
  }
  prof.addEventListener("pointerdown",function(e){ drag=true; S.playing=false; setIcon(); prof.setPointerCapture(e.pointerId); at(e); });
  prof.addEventListener("pointermove",function(e){ if(drag) at(e); });
  prof.addEventListener("pointerup",function(){ drag=false; });
  prof.addEventListener("pointercancel",function(){ drag=false; });
})();
window.addEventListener("resize",function(){ if(!vbTarget) flyTo(fitDay(day()),true); });

/* ---- init ---- */

[].forEach.call(document.querySelectorAll("[data-i18n]"),function(n){ n.textContent=T(n.getAttribute("data-i18n")); });
buildMap();
buildStrip();
document.getElementById("tourSub").textContent=L(TOUR.dates)+" · "+L(TOUR.short)+" · "+TOUR.guide;
setDay(0,true);
requestAnimationFrame(loop);
setTimeout(function(){ if(!S.playing){ S.playing=true; setIcon(); } },1200);
})();

<script>
(function(){
"use strict";
var WS=window.WS;

/* ============================================================
   Tour media. Every frame below is drawn from shapes and
   gradients at render time - no bitmaps, no external files.
   ============================================================ */
function rnd(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function ridge(y,amp,f,ph){
  var d="M0,300L0,"+y.toFixed(1), x, yy;
  for(x=0;x<=400;x+=8){
    yy=y-Math.sin(x*f+ph)*amp-Math.sin(x*f*2.3+ph*1.7)*amp*.42-Math.sin(x*f*.47+ph*.6)*amp*.75;
    d+="L"+x+","+yy.toFixed(1);
  }
  return d+"L400,300Z";
}
function pal(h){
  if(h<6.6) return {a:"#16233F",b:"#8E5C6E",c:"#F0A070",s1:"#0E1830",s2:"#5A4560",sea:"#2B3550",warm:.75,sunY:206,sunC:"#FFC98A"};
  if(h<9)   return {a:"#2C6EA6",b:"#9FCBDD",c:"#D9EAEC",s1:"#1D3A44",s2:"#3E6470",sea:"#5A93AE",warm:.25,sunY:120,sunC:"#FFF3D0"};
  if(h<14)  return {a:"#2A7FC4",b:"#8FC4DE",c:"#D6EAF0",s1:"#1B3A34",s2:"#3D6A54",sea:"#3E8FB8",warm:.1,sunY:70,sunC:"#FFFBE8"};
  if(h<16.6)return {a:"#3E82AC",b:"#C7D8CE",c:"#F2DDB8",s1:"#23392F",s2:"#4A6B50",sea:"#4E8CA6",warm:.35,sunY:150,sunC:"#FFE9AE"};
  if(h<18.8)return {a:"#243A63",b:"#B0648A",c:"#F0A15C",s1:"#141F2E",s2:"#3A3550",sea:"#3B4C6B",warm:.8,sunY:196,sunC:"#FFC070"};
  return {a:"#070E1E",b:"#132244",c:"#22375E",s1:"#050A14",s2:"#101C30",sea:"#0C1730",warm:.15,sunY:0,sunC:"#CFE0FF"};
}
function art(kind,seed,h){
  var p=pal(h), r=rnd(seed), id="a"+seed, o="";
  o+='<defs><linearGradient id="sky'+id+'" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0" stop-color="'+p.a+'"/><stop offset=".62" stop-color="'+p.b+'"/>'+
     '<stop offset="1" stop-color="'+p.c+'"/></linearGradient>'+
     '<radialGradient id="vig'+id+'" cx=".5" cy=".42" r=".78">'+
     '<stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".30"/></radialGradient>'+
     '<linearGradient id="sea'+id+'" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0" stop-color="'+p.sea+'"/><stop offset="1" stop-color="'+p.s2+'"/></linearGradient></defs>';
  o+='<rect width="400" height="300" fill="url(#sky'+id+')"/>';
  if(h>=6&&h<19){
    o+='<circle cx="'+(70+r()*260).toFixed(0)+'" cy="'+p.sunY+'" r="'+(16+p.warm*16).toFixed(0)+'" fill="'+p.sunC+'" opacity="'+(.35+p.warm*.55).toFixed(2)+'"/>';
  } else {
    for(var st=0;st<46;st++) o+='<circle cx="'+(r()*400).toFixed(0)+'" cy="'+(r()*160).toFixed(0)+'" r="'+(r()*1.1+.3).toFixed(2)+'" fill="#fff" opacity="'+(.25+r()*.6).toFixed(2)+'"/>';
  }
  var i;
  for(i=0;i<3;i++) o+='<ellipse cx="'+(r()*400).toFixed(0)+'" cy="'+(30+r()*90).toFixed(0)+'" rx="'+(50+r()*70).toFixed(0)+'" ry="'+(7+r()*9).toFixed(0)+'" fill="#fff" opacity="'+(.08+r()*.16).toFixed(2)+'"/>';

  function ridges(n,y0,dy,amp){
    /* atmospheric perspective: distant ridges wash toward the sky colour but
       stay opaque, so they never vanish against a pale morning. */
    var s="";
    for(var k=0;k<n;k++){
      var t=k/(n-1||1);
      s+='<path d="'+ridge(y0+k*dy,amp*(1-t*.35),0.006+r()*0.004,r()*9)+'" fill="'+mix(p.s1,p.b,(1-t)*.46)+'"/>';
    }
    return s;
  }
  function mix(c1,c2,t){
    function v(c){ return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)]; }
    var a=v(c1),b=v(c2),q=[0,1,2].map(function(j){ return Math.round(a[j]+(b[j]-a[j])*t); });
    return "rgb("+q.join(",")+")";
  }
  function water(y){
    var s='<rect x="0" y="'+y+'" width="400" height="'+(300-y)+'" fill="url(#sea'+id+')"/>'+
      '<rect x="0" y="'+y+'" width="400" height="1.6" fill="#fff" opacity=".34"/>'+
      '<rect x="0" y="'+(y+1.6)+'" width="400" height="'+(300-y-1.6)+'" fill="'+p.s1+'" opacity=".14"/>';
    for(var k=0;k<16;k++){
      var wy=y+8+r()*(300-y-10);
      s+='<rect x="'+(r()*330).toFixed(0)+'" y="'+wy.toFixed(0)+'" width="'+(18+r()*70).toFixed(0)+'" height="1.4" rx=".7" fill="#fff" opacity="'+(.06+r()*.18).toFixed(2)+'"/>';
    }
    return s;
  }

  if(kind==="bridge"){
    o+=ridges(2,168,14,16)+water(196);
    var bx=60+r()*40, by=196, tw=196;
    o+='<path d="M0,150 Q'+(bx+tw/2)+','+(by-96)+' '+(bx+tw)+',152" fill="none" stroke="'+p.s1+'" stroke-width="3" opacity=".9"/>';
    o+='<path d="M'+(bx+tw)+',152 Q'+(bx+tw+90)+',108 400,146" fill="none" stroke="'+p.s1+'" stroke-width="3" opacity=".9"/>';
    for(i=0;i<26;i++){
      var hx=8+i*15.6, t2=hx/400;
      var hy=hx<bx+tw? 150+(1-Math.pow((hx-(bx+tw/2))/(tw/2),2))*-96*0+ (150 - 96*(1-Math.pow((hx-(bx+tw/2))/(tw/2+40),2))) : 130+t2*20;
      o+='<line x1="'+hx.toFixed(0)+'" y1="'+Math.max(58,hy).toFixed(0)+'" x2="'+hx.toFixed(0)+'" y2="172" stroke="'+p.s1+'" stroke-width="1" opacity=".55"/>';
    }
    o+='<rect x="0" y="170" width="400" height="7" fill="'+p.s1+'" opacity=".95"/>';
    o+='<rect x="'+(bx-5)+'" y="54" width="10" height="122" fill="'+p.s1+'"/>';
    o+='<rect x="'+(bx+tw-5)+'" y="54" width="10" height="122" fill="'+p.s1+'"/>';
    o+='<rect x="0" y="177" width="400" height="123" fill="'+p.s1+'" opacity=".18"/>';
  } else if(kind==="island"){
    o+=ridges(3,150,17,20)+water(190);
    for(i=0;i<3;i++){
      var ix=40+r()*300, iw=40+r()*70;
      o+='<path d="M'+(ix-iw/2)+',192 Q'+ix+','+(168-r()*22)+' '+(ix+iw/2)+',192 Z" fill="'+mix(p.s1,p.b,.30-i*.12)+'"/>';
    }
    o+='<path d="M282,236 l30,0 l-5,9 l-22,0 Z" fill="'+p.s1+'"/><rect x="294" y="222" width="2" height="15" fill="'+p.s1+'"/>';
  } else if(kind==="karst"){
    o+=ridges(3,140,20,22);
    o+='<path d="'+ridge(214,10,.008,2)+'" fill="'+mix(p.s2,"#8E9B6E",.55)+'"/>';
    for(i=0;i<13;i++){
      var kx=r()*400, ky=214+r()*72, ks=5+r()*11;
      o+='<path d="M'+kx.toFixed(0)+','+ky.toFixed(0)+' l'+(-ks*.7).toFixed(1)+','+ks.toFixed(1)+' l'+(ks*1.4).toFixed(1)+',0 Z" fill="#E4E6DA" opacity="'+(.55+r()*.4).toFixed(2)+'"/>';
    }
    o+='<g stroke="'+p.s1+'" stroke-width="2.2" fill="none" opacity=".85"><line x1="330" y1="196" x2="330" y2="150"/>'+
       '<path d="M330,150 l0,-22 M330,150 l19,11 M330,150 l-19,11"/></g>';
    for(i=0;i<4;i++) o+='<ellipse cx="'+(70+r()*200).toFixed(0)+'" cy="'+(240+r()*40).toFixed(0)+'" rx="7" ry="4.4" fill="'+p.s1+'" opacity=".7"/>';
  } else if(kind==="cloudsea"){
    o+=ridges(4,128,15,19);
    o+='<rect x="0" y="188" width="400" height="112" fill="#fff" opacity=".9"/>';
    for(i=0;i<10;i++) o+='<ellipse cx="'+(r()*400).toFixed(0)+'" cy="'+(186+r()*24).toFixed(0)+'" rx="'+(40+r()*70).toFixed(0)+'" ry="'+(11+r()*13).toFixed(0)+'" fill="#fff" opacity="'+(.5+r()*.5).toFixed(2)+'"/>';
    o+='<path d="'+ridge(178,13,.009,3)+'" fill="'+p.s1+'" opacity=".82"/>';
  } else if(kind==="terrace"){
    o+=ridges(2,120,16,18);
    for(i=0;i<8;i++){
      var ty=150+i*20, cur=16+i*3;
      o+='<path d="M-10,'+ty+' Q200,'+(ty-cur)+' 410,'+(ty+4)+' L410,'+(ty+21)+' Q200,'+(ty+21-cur)+' -10,'+(ty+17)+' Z" fill="'+mix("#C9A85C","#6E7A44",i/8)+'" opacity="'+(.72+i*.03).toFixed(2)+'"/>';
      o+='<path d="M-10,'+ty+' Q200,'+(ty-cur)+' 410,'+(ty+4)+'" fill="none" stroke="'+p.s1+'" stroke-width=".8" opacity=".3"/>';
    }
  } else if(kind==="river"){
    o+=ridges(3,120,18,20);
    o+='<rect x="0" y="176" width="400" height="124" fill="'+mix("#4E7A54",p.s1,.35)+'"/>';
    o+='<path d="M-20,300 C90,250 60,214 150,196 C230,180 280,186 420,172 L420,300 Z" fill="url(#sea'+id+')"/>';
    o+='<path d="M-20,300 C90,250 60,214 150,196 C230,180 280,186 420,172" fill="none" stroke="#fff" stroke-width="1.4" opacity=".28"/>';
    o+='<rect x="96" y="196" width="184" height="4.5" rx="1" fill="#D8D6CC" opacity=".95" transform="rotate(-7 190 198)"/>';
    for(i=0;i<3;i++) o+='<rect x="'+(120+i*62)+'" y="200" width="7" height="16" fill="#C6C4B8" opacity=".85" transform="rotate(-7 190 198)"/>';
    for(i=0;i<9;i++) o+='<ellipse cx="'+(r()*400).toFixed(0)+'" cy="'+(232+r()*60).toFixed(0)+'" rx="'+(14+r()*30).toFixed(0)+'" ry="2" fill="#fff" opacity="'+(.08+r()*.14).toFixed(2)+'"/>';
  } else if(kind==="tunnel"){
    o='<rect width="400" height="300" fill="#0B1015"/>';
    o+='<path d="M40,300 L40,120 Q200,26 360,120 L360,300 Z" fill="#1B242A"/>';
    o+='<path d="M96,300 L96,150 Q200,86 304,150 L304,300 Z" fill="#0A0F13"/>';
    o+='<ellipse cx="200" cy="196" rx="46" ry="40" fill="#EDE4C8" opacity=".92"/>';
    o+='<ellipse cx="200" cy="196" rx="78" ry="66" fill="#EDE4C8" opacity=".16"/>';
    o+='<rect x="0" y="272" width="400" height="28" fill="#141B21"/>';
    for(i=0;i<7;i++) o+='<rect x="'+(i*62)+'" y="284" width="34" height="3" fill="#C8CDB8" opacity=".5"/>';
    o+='<circle cx="200" cy="252" r="5" fill="#FF5A4A" opacity=".9"/>';
  } else if(kind==="town"){
    o+=ridges(2,124,15,17);
    var bx2=0;
    while(bx2<400){
      var bw=38+r()*46, bh=52+r()*46, byy=300-bh;
      o+='<rect x="'+bx2.toFixed(0)+'" y="'+byy.toFixed(0)+'" width="'+bw.toFixed(0)+'" height="'+bh.toFixed(0)+'" fill="'+mix("#4C4238",p.s1,r()*.6)+'"/>';
      o+='<path d="M'+(bx2-6).toFixed(0)+','+byy.toFixed(0)+' L'+(bx2+bw/2).toFixed(0)+','+(byy-15).toFixed(0)+' L'+(bx2+bw+6).toFixed(0)+','+byy.toFixed(0)+' Z" fill="'+mix("#2E3B44",p.s1,.3)+'"/>';
      for(i=0;i<4;i++) o+='<line x1="'+(bx2-4+i*(bw/3.4)).toFixed(0)+'" y1="'+byy+'" x2="'+(bx2+bw/2).toFixed(0)+'" y2="'+(byy-14)+'" stroke="#fff" stroke-width=".6" opacity=".18"/>';
      if(r()>.45) o+='<rect x="'+(bx2+bw*.3).toFixed(0)+'" y="'+(byy+18).toFixed(0)+'" width="'+(bw*.4).toFixed(0)+'" height="16" fill="'+(h>16.5?"#FFCF87":"#D9DCD0")+'" opacity="'+(h>16.5?.9:.35)+'"/>';
      bx2+=bw+3;
    }
  } else if(kind==="onsen"){
    o+=ridges(2,120,14,11);
    o+='<rect x="66" y="150" width="268" height="150" fill="#3B3128"/>';
    o+='<path d="M52,152 L200,96 L348,152 Z" fill="#25303A"/>';
    o+='<path d="M120,110 L200,74 L280,110 Z" fill="#25303A"/>';
    o+='<rect x="188" y="60" width="24" height="20" fill="#B23B2E"/>';
    for(i=0;i<6;i++) o+='<rect x="'+(84+i*42)+'" y="184" width="26" height="34" fill="#FFCB7A" opacity=".92"/>';
    for(i=0;i<6;i++) o+='<rect x="'+(84+i*42)+'" y="236" width="26" height="26" fill="#FFCB7A" opacity=".55"/>';
    for(i=0;i<5;i++) o+='<path d="M'+(50+i*80)+',150 q10,-26 0,-46 q-10,-22 0,-40" fill="none" stroke="#fff" stroke-width="4" opacity="'+(.1+r()*.16).toFixed(2)+'" stroke-linecap="round"/>';
  } else if(kind==="pine"){
    o+=ridges(2,146,14,7)+water(184);
    o+='<rect x="0" y="228" width="400" height="72" fill="'+mix("#C9B58E",p.s1,.25)+'"/>';
    for(i=0;i<11;i++){
      var px2=r()*400, ph2=52+r()*54;
      o+='<rect x="'+(px2-2).toFixed(0)+'" y="'+(238-ph2).toFixed(0)+'" width="4" height="'+ph2.toFixed(0)+'" fill="'+p.s1+'"/>';
      for(var b=0;b<3;b++) o+='<ellipse cx="'+(px2+(r()-.5)*22).toFixed(0)+'" cy="'+(238-ph2+b*15).toFixed(0)+'" rx="'+(15+r()*13).toFixed(0)+'" ry="6" fill="'+p.s1+'" opacity=".92"/>';
    }
  } else if(kind==="statue"){
    o+=ridges(1,168,0,5)+water(190);
    o+='<path d="M0,300 L0,244 Q90,214 180,240 Q290,268 400,246 L400,300 Z" fill="'+mix("#C9B58E",p.s1,.3)+'"/>';
    o+='<path d="M232,246 L262,246 L252,196 Z" fill="'+p.s1+'"/>';
    o+='<g fill="'+p.s1+'"><ellipse cx="252" cy="150" rx="7" ry="9"/><path d="M245,160 q7,-5 14,0 l5,38 l-24,0 Z"/><path d="M241,172 l-7,20 l5,2 l8,-18 Z"/></g>';
    o+='<ellipse cx="252" cy="199" rx="18" ry="4" fill="'+p.s1+'" opacity=".5"/>';
  } else if(kind==="lodge"){
    o+='<rect x="0" y="212" width="400" height="88" fill="#0B1420"/>';
    o+='<path d="'+ridge(214,16,.007,4)+'" fill="#0A121C"/>';
    o+='<rect x="128" y="212" width="150" height="60" fill="#111C26"/>';
    o+='<path d="M116,213 L203,178 L290,213 Z" fill="#0C1620"/>';
    for(i=0;i<4;i++) o+='<rect x="'+(142+i*32)+'" y="228" width="20" height="22" fill="#FFC97E" opacity=".92"/>';
    o+='<ellipse cx="203" cy="240" rx="120" ry="46" fill="#FFC97E" opacity=".07"/>';
  } else if(kind==="pass"){
    o+=ridges(3,116,20,22);
    o+='<path d="'+ridge(178,12,.007,6)+'" fill="'+mix(p.s2,"#3F5A42",.5)+'"/>';
    o+='<path d="M-10,300 C70,268 40,244 130,232 C220,220 176,196 268,188 C330,182 320,168 410,164" fill="none" stroke="#D8D4C6" stroke-width="9" stroke-linecap="round" opacity=".92"/>';
    o+='<path d="M-10,300 C70,268 40,244 130,232 C220,220 176,196 268,188 C330,182 320,168 410,164" fill="none" stroke="#8E8A7C" stroke-width="9.6" stroke-linecap="round" opacity=".25"/>';
    o+='<path d="M-10,300 C70,268 40,244 130,232 C220,220 176,196 268,188 C330,182 320,168 410,164" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="7 9" opacity=".55"/>';
  } else if(kind==="forest"){
    o='<rect width="400" height="300" fill="'+mix("#7E8E86","#2A3A34",.35)+'"/>';
    for(i=0;i<15;i++){
      var fx=r()*400, fw=5+r()*16, dep=r();
      o+='<rect x="'+fx.toFixed(0)+'" y="'+(-20+r()*40).toFixed(0)+'" width="'+fw.toFixed(0)+'" height="330" fill="'+mix("#8FA096","#1C2A24",dep)+'" opacity="'+(.35+dep*.6).toFixed(2)+'"/>';
    }
    o+='<rect width="400" height="300" fill="#E6EDE8" opacity=".28"/>';
    o+='<ellipse cx="180" cy="120" rx="190" ry="120" fill="#fff" opacity=".22"/>';
    o+='<rect x="0" y="262" width="400" height="38" fill="#3A4438" opacity=".8"/>';
  } else if(kind==="market"){
    o='<rect width="400" height="300" fill="#241C18"/>';
    for(i=0;i<5;i++) o+='<rect x="'+(i*84-10)+'" y="0" width="42" height="58" fill="'+(i%2?"#B8442F":"#E8E2D2")+'" opacity=".9"/>';
    o+='<rect x="0" y="58" width="400" height="8" fill="#3A2E26"/>';
    o+='<rect x="0" y="214" width="400" height="86" fill="#3A2E26"/>';
    o+='<ellipse cx="196" cy="212" rx="86" ry="16" fill="#1A1310"/>';
    o+='<path d="M150,214 q46,-96 92,0 Z" fill="#FF8A2E" opacity=".92"/>';
    o+='<path d="M166,214 q30,-66 60,0 Z" fill="#FFD66A" opacity=".95"/>';
    for(i=0;i<12;i++) o+='<circle cx="'+(150+r()*92).toFixed(0)+'" cy="'+(96+r()*100).toFixed(0)+'" r="'+(1+r()*2).toFixed(1)+'" fill="#FFE9A8" opacity="'+(.4+r()*.6).toFixed(2)+'"/>';
    for(i=0;i<4;i++) o+='<circle cx="'+(50+i*100)+'" cy="86" r="9" fill="#FFCF87" opacity=".85"/>';
  } else { /* food */
    o='<rect width="400" height="300" fill="'+mix("#3A2E26","#1A1512",.3)+'"/>';
    o+='<rect x="0" y="176" width="400" height="124" fill="#4A3A2E"/>';
    for(i=0;i<7;i++) o+='<rect x="0" y="'+(176+i*18)+'" width="400" height="1.4" fill="#000" opacity=".16"/>';
    o+='<ellipse cx="200" cy="204" rx="122" ry="40" fill="#000" opacity=".22"/>';
    o+='<ellipse cx="200" cy="196" rx="116" ry="38" fill="#E9E4D6"/>';
    o+='<ellipse cx="200" cy="194" rx="94" ry="30" fill="#DAD3C2"/>';
    var fc=["#C8503C","#E8B84A","#6E8E4A","#F2E4C4","#8E5A32"];
    for(i=0;i<9;i++){
      var ax=200+(r()-.5)*130, ay=192+(r()-.5)*36;
      o+='<ellipse cx="'+ax.toFixed(0)+'" cy="'+ay.toFixed(0)+'" rx="'+(11+r()*17).toFixed(0)+'" ry="'+(6+r()*9).toFixed(0)+'" fill="'+fc[(i+seed)%5]+'" opacity="'+(.82+r()*.18).toFixed(2)+'" transform="rotate('+(r()*90-45).toFixed(0)+' '+ax.toFixed(0)+' '+ay.toFixed(0)+')"/>';
    }
    for(i=0;i<4;i++) o+='<path d="M'+(150+i*34)+',150 q9,-24 0,-42" fill="none" stroke="#fff" stroke-width="3" opacity=".13" stroke-linecap="round"/>';
    o+='<rect x="284" y="150" width="76" height="4" rx="2" fill="#7A5A3A" transform="rotate(-16 322 152)"/>';
    o+='<rect x="284" y="160" width="76" height="4" rx="2" fill="#7A5A3A" transform="rotate(-16 322 162)"/>';
  }
  o+='<rect width="400" height="300" fill="url(#vig'+id+')"/>';
  return o;
}
function artSVG(m,cls){
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" class="'+(cls||"")+'" aria-hidden="true">'+art(m.k,m.sd,m.h)+'</svg>';
}

/* ---- media log: 36 moments from the seven days ---- */
var M=[
 {d:0,f:.01,tm:"06:42",h:6.7,ty:"photo",k:"island",sd:11,ja:"尾道水道、始発の渡船を待つ",en:"Waiting for the first ferry, Onomichi channel",cja:"7人分の自転車を岸に並べて5分待つ。対岸の向島がまだ藍色だった。",cen:"Seven bikes lined up on the slip. Mukaishima still ink-blue across the water."},
 {d:0,f:.20,ty:"video",dur:"0:32",tm:"09:14",h:9.2,k:"bridge",sd:23,ja:"因島大橋の下層を走る",en:"Riding the lower deck, Innoshima Bridge",cja:"車道の下を通る自転車道。金網の向こうを潮が速く流れていく音がずっと続く。",cen:"The cycle deck runs beneath the traffic. The tide roars past the mesh the whole way over."},

 {d:0,f:.50,ty:"video",dur:"0:18",tm:"13:22",h:13.4,k:"bridge",sd:43,ja:"多々羅大橋の鳴き龍",en:"The dragon echo, Tatara Bridge",cja:"主塔の真下で拍子木を打つ。音が塔を駆け上がって降りてくる。Marco が三回やった。",cen:"Clap under the tower and the sound climbs it and falls back. Marco did it three times."},

 {d:5,f:.82,tm:"14:22",h:14.4,ty:"photo",k:"river",sd:281,ja:"岩間沈下橋、集合写真",en:"Iwama bridge, the group shot",cja:"ポスターで有名な一本。毎ツアーここで撮る。7人と7台。",cen:"The postcard bridge. Same photo every tour. Seven people, seven bikes."},
 {d:5,f:.97,ty:"video",dur:"0:29",tm:"16:48",h:16.8,k:"river",sd:283,ja:"佐田沈下橋、291.6m",en:"Sada bridge, 291.6 metres",cja:"河口にいちばん近い最長の沈下橋。渡り切ると中村の町。",cen:"The longest and the closest to the sea. Nakamura is on the far side."},

 {d:6,f:.02,tm:"08:12",h:8.2,ty:"photo",k:"town",sd:293,ja:"久礼、輪行袋をほどく",en:"Kure: unpacking the bikes",cja:"中村から土讃線で移動してきた朝。7台を組み直して15分。",cen:"After the morning train from Nakamura. Fifteen minutes to rebuild seven bikes."},

 {d:6,f:.31,tm:"13:18",h:13.3,ty:"photo",k:"tunnel",sd:311,ja:"焼坂トンネル、照明が弱い",en:"Yakizaka tunnel, poor lighting",cja:"路肩が狭く暗い。入る前に全員のリアライトを目視で確認する場所。",cen:"Narrow and dim. I check every rear light by eye before we enter."},
 {d:6,f:.62,tm:"15:38",h:15.6,ty:"photo",k:"pine",sd:313,ja:"土佐の海岸線、松と太平洋",en:"The Tosa coast, pines and the Pacific",cja:"追い風。最終日の午後に西風が入るのは毎年ほぼ同じ。",cen:"Tailwind. The westerly comes in on the last afternoon almost every year."},
 {d:6,f:.90,tm:"17:12",h:17.2,ty:"photo",k:"statue",sd:317,ja:"桂浜、龍馬は太平洋を向いている",en:"Katsurahama: Ryoma faces the Pacific",cja:"508km走った7人の最後の写真。像の視線の先には何もない。だからいい。",cen:"The last photo after 508 km. The statue looks at nothing at all, which is the point."}
];
M.forEach(function(m,i){
  var d=WS.DAYS[m.d];
  m.i=Math.min(d.s.length-1,Math.round(m.f*(d.s.length-1)));
  m.km=d.s[m.i].d; m.ele=d.s[m.i].e; m.idx=i;
});
M.sort(function(a,b){ return a.d-b.d || a.km-b.km; });
M.forEach(function(m,i){ m.idx=i; });

function T(k){ return WS.T(k); }
function isJa(){ return WS.getLang()==="ja"; }
function ttl(m){ return isJa()?m.ja:m.en; }
function cap(m){ return isJa()?m.cja:m.cen; }
function badge(m){
  return m.ty==="video"
    ? '<span class="vbadge">'+m.dur+'</span><span class="vplay"><i></i></span>'
    : '';
}

/* ---- map thumbnails ---- */
function onDay(d){
  var g=WS.pins(), di=WS.DAYS.indexOf(d);
  M.filter(function(m){ return m.d===di; }).forEach(function(m,j){
    var q=WS.P([d.s[m.i].lat,d.s[m.i].lng]);
    /* consecutive stops sit close together on the map; fan the cards out */
    var ox=[0,36,-36,18,-18,52][j%6], oy=[-26,-70,-70,-114,-114,-26][j%6];
    var n=WS.el("g",{"data-sx":q[0].toFixed(1),"data-sy":q[1].toFixed(1),"data-k":1,style:"cursor:pointer"});
    var cy=oy-20, cx=ox;
    n.innerHTML='<defs><clipPath id="mc'+m.idx+'"><rect x="'+(cx-20)+'" y="'+(cy-20)+'" width="40" height="40" rx="9"/></clipPath></defs>'+
      '<line x1="0" y1="-2" x2="'+cx+'" y2="'+(cy+18)+'" stroke="var(--accent)" stroke-width="1.5"/>'+
      '<circle cx="0" cy="0" r="2.8" fill="var(--accent)"/>'+
      '<rect x="'+(cx-22)+'" y="'+(cy-22)+'" width="44" height="44" rx="11" fill="var(--surface)"/>'+
      '<g clip-path="url(#mc'+m.idx+')"><g transform="translate('+(cx-26.7)+','+(cy-20)+') scale(0.1333)">'+art(m.k,m.sd,m.h)+'</g></g>'+
      '<rect x="'+(cx-20)+'" y="'+(cy-20)+'" width="40" height="40" rx="9" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity=".9"/>'+
      (m.ty==="video"
        ? '<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="rgba(8,14,17,.52)"/><path d="M'+(cx-3)+','+(cy-5)+' L'+(cx+6)+','+cy+' L'+(cx-3)+','+(cy+5)+' Z" fill="#fff"/>'
        : '');
    n.addEventListener("click",function(ev){ ev.stopPropagation(); open(m.idx); });
    g.appendChild(n);
  });
  WS.rescale();
  strip.innerHTML=""; shown={}; strip.classList.remove("on");
}

/* ---- playback filmstrip ---- */
var strip=document.getElementById("strip"), shown={};
function onProgress(d,km){
  var di=WS.DAYS.indexOf(d);
  M.forEach(function(m){
    if(m.d!==di || m.km>km || shown[m.idx]) return;
    shown[m.idx]=1;
    if(!strip.childElementCount){
      var l=document.createElement("div"); l.className="sl"; l.textContent=T("passed"); strip.appendChild(l);
    }
    var b=document.createElement("button");
    b.className="thumb pop"; b.setAttribute("aria-label",ttl(m));
    b.innerHTML=artSVG(m)+badge(m);
    b.addEventListener("click",function(){ open(m.idx); });
    strip.appendChild(b);
    strip.classList.add("on");
    strip.scrollTo({left:strip.scrollWidth,behavior:"smooth"});
  });
  if(km<0.05 && strip.childElementCount){ strip.innerHTML=""; shown={}; strip.classList.remove("on"); }
}

/* ---- bottom sheet ---- */
var sheet=document.getElementById("sheet"), stage=document.getElementById("stage"),
    stageArt=document.getElementById("stageArt"), bigplay=document.getElementById("bigplay"),
    vbar=document.getElementById("vbar"), vbarI=document.getElementById("vbarI"),
    vtime=document.getElementById("vtime"), cur=0, vTimer=null;

function secs(s){ var p=String(s).split(":"); return (+p[0])*60+(+p[1]); }
function mmss(t){ return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"); }
function stopVideo(){
  clearInterval(vTimer); vTimer=null;
  stage.classList.remove("kb"); vbar.classList.remove("on"); vtime.classList.remove("on");
  vbarI.style.width="0";
}
function playVideo(m){
  bigplay.classList.add("hide");
  stage.classList.remove("kb"); void stage.offsetWidth; stage.classList.add("kb");
  vbar.classList.add("on"); vtime.classList.add("on");
  var total=secs(m.dur), t0=Date.now(), span=9000;
  vTimer=setInterval(function(){
    var p=Math.min(1,(Date.now()-t0)/span);
    vbarI.style.width=(p*100).toFixed(1)+"%";
    vtime.textContent=mmss(p*total)+" / "+m.dur;
    if(p>=1){ clearInterval(vTimer); vTimer=null; bigplay.classList.remove("hide"); }
  },80);
}
function paint(){
  var m=M[cur], d=WS.DAYS[m.d];
  stopVideo();
  stageArt.innerHTML=artSVG(m);
  bigplay.classList.toggle("hide",m.ty!=="video");
  document.getElementById("sMeta").innerHTML=
    "<b>DAY "+d.n+"</b> · "+m.tm+" · KM "+WS.fmt(m.km,1)+" · "+WS.fmt(m.ele,0)+" m · "+
    (m.ty==="video"?T("videoOf")+" "+m.dur:T("photoOf"));
  document.getElementById("sTitle").textContent=ttl(m);
  document.getElementById("sCap").textContent=cap(m);
  document.getElementById("sTags").innerHTML=
    '<span class="pinchip"><span class="dot" style="background:var(--accent)"></span>'+
    (isJa()?d.from.ja+" → "+d.to.ja:d.from.en+" → "+d.to.en)+'</span>'+
    '<span class="pinchip"><span class="dot" style="background:var(--route)"></span>'+
    (isJa()?"ルート上 "+WS.fmt(m.km/d.km*100,0)+"%":WS.fmt(m.km/d.km*100,0)+"% "+T("onRoute"))+'</span>';
  document.getElementById("sCount").textContent=(cur+1)+" / "+M.length;
  document.getElementById("prevB").disabled=cur===0;
  document.getElementById("nextB").disabled=cur===M.length-1;
}
function open(i){
  WS.S.playing=false;
  document.getElementById("playIcon").innerHTML='<path d="M4 2.5v11l9-5.5z"/>';
  cur=i; sheet.classList.add("on"); paint();
}
function close(){ stopVideo(); sheet.classList.remove("on"); }
function step(n){ var t=cur+n; if(t<0||t>=M.length) return; cur=t; paint(); }

document.getElementById("closeB").addEventListener("click",close);
document.getElementById("scrim").addEventListener("click",close);
document.getElementById("prevB").addEventListener("click",function(){ step(-1); });
document.getElementById("nextB").addEventListener("click",function(){ step(1); });
bigplay.addEventListener("click",function(){ playVideo(M[cur]); });
document.addEventListener("keydown",function(e){
  if(!sheet.classList.contains("on")) return;
  if(e.key==="Escape") close();
  if(e.key==="ArrowRight") step(1);
  if(e.key==="ArrowLeft") step(-1);
});
(function(){
  var x0=null;
  stage.addEventListener("pointerdown",function(e){ x0=e.clientX; });
  stage.addEventListener("pointerup",function(e){
    if(x0===null) return;
    var dx=e.clientX-x0; x0=null;
    if(Math.abs(dx)>44) step(dx<0?1:-1);
  });
  stage.addEventListener("pointercancel",function(){ x0=null; });
})();

/* ---- album ---- */
function renderAlbum(){
  var b=document.getElementById("albumBody"),h="",cd=-1;
  h+='<div class="hero" style="padding:14px 15px"><div class="ht">'+T("album")+'</div>'+
     '<div class="hn" style="font-size:19px">'+M.length+' <span style="font-size:13px;font-weight:600;color:var(--ink3)">'+T("shots")+'</span></div>'+
     '<div class="hd">'+T("tapPin")+'</div></div>';
  M.forEach(function(m){
    var d=WS.DAYS[m.d];
    if(m.d!==cd){
      if(cd>=0) h+='</div>';
      cd=m.d;
      h+='<div class="albday"><span class="an">Day '+d.n+' — '+(isJa()?d.to.ja:d.to.en)+'</span>'+
         '<span class="am">'+M.filter(function(x){return x.d===cd;}).length+' '+T("shots")+'</span></div><div class="grid">';
    }
    h+='<button class="gcell" data-m="'+m.idx+'" aria-label="'+ttl(m).replace(/"/g,"")+'">'+artSVG(m)+
       (m.ty==="video"?'<span class="vbadge">'+m.dur+'</span><span class="vplay"><i></i></span>':'')+
       '<span class="gcap"><span class="gt">'+ttl(m)+'</span><span class="gm">'+m.tm+' · KM '+WS.fmt(m.km,1)+'</span></span></button>';
  });
  h+='</div>';
  b.innerHTML=h;
  [].forEach.call(b.querySelectorAll("[data-m]"),function(btn){
    btn.addEventListener("click",function(){ open(+btn.getAttribute("data-m")); });
  });
}

window.WSM={
  onDay:onDay, onProgress:onProgress, renderAlbum:renderAlbum,
  relang:function(){ if(sheet.classList.contains("on")) paint(); }
};
WS.setDay(WS.S.di,true);
})();
</script>
